name: CI

# NOTE: this workflow deliberately does NOT compile or load the eBPF
# programs in ebpf/ — that requires a privileged Linux kernel with BPF
# support, which standard GitHub-hosted runners don't safely provide.
# It runs static checks only. Real kernel-hook testing happens on a
# teammate's Linux VM per docs/SETUP.md, manually, before merging any
# ebpf/*.c change.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r controller/requirements.txt

      - name: Lint (flake8)
        run: flake8 . --max-line-length=100 --exclude=.venv

      - name: Run smoke tests (no kernel/root required)
        run: pytest -v

      - name: Validate policy JSON
        run: python3 -c "import json; json.load(open('policy/policy_schema.example.json'))"
