name: CI

# This workflow only runs the tests that don't need root or a real Linux
# kernel with eBPF/BCC support (policy engine logic, CLI argument parsing).
# It does NOT compile or load the eBPF programs in ebpf/ - that requires a
# privileged kernel environment standard GitHub-hosted runners don't provide.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v